vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm_backend
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN} # Optional: Add your HF token in .env for private models or to increase rate limits
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface # Caches downloaded models locally
    ports:
      - "8000:8000" # Exposed to host so you can test vLLM directly if needed
    command: [
      "--model", "Qwen/Qwen3.5-0.8B", # Change to whichever model you want to run
      "--port", "8000"
    ]
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]